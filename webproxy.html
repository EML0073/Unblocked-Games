<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNBLOCKEDgames - HORIZON Proxy</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #101010; color: #eee; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    .top-bar { height: 58px; padding: 0 4%; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand-logo { display: block; width: 235px; height: 48px; object-fit: contain; object-position: left center; filter: brightness(0) invert(1); }
    nav { display: flex; align-items: center; gap: 8px; }
    nav a { color: #aaa; text-decoration: none; padding: 9px 13px; border-radius: 4px; font-size: 14px; }
    nav a:hover, nav a.active { color: #fff; background: #303030; }
    .frame-wrap { height: calc(100% - 58px); width: 100%; }
    #horizonFrame { display: block; width: 100%; height: 100%; border: 0; background: #101010; }
    @media(max-width:650px) { .top-bar { height: auto; min-height: 58px; flex-wrap: wrap; justify-content: center; padding: 8px; } .brand-logo { width: 190px; } nav { width: 100%; justify-content: center; } .frame-wrap { height: calc(100% - 105px); } }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="index.html" aria-label="UNBLOCKEDgames"><img class="brand-logo" src="argazkik/UNBLOCKEDgames_logo.svg?v=3" alt="UNBLOCKEDgames"></a>
    <nav aria-label="Main menu">
      <a href="index.html">Games</a>
      <a href="proxy.html">GUST Proxy</a>
      <a class="active" href="webproxy.html">HORIZON Proxy</a>
      <a href="https://sites.google.com/view/search-internet/google" target="_blank" rel="noopener noreferrer">Launcher</a>
    </nav>
  </header>
  <main class="frame-wrap">
    <iframe id="horizonFrame" src="horizon.html" title="HORIZON browser" allow="fullscreen; clipboard-read; clipboard-write; autoplay; gamepad"></iframe>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const target = params.get('url');
      if (!target) return;
      let attempts = 0;
      const frame = document.getElementById('horizonFrame');
      function openTarget() {
        attempts++;
        try {
          const doc = frame.contentDocument;
          const address = doc && doc.getElementById('url');
          const go = doc && doc.getElementById('go');
          if (address && go) {
            address.value = target;
            go.click();
            return;
          }
        } catch (error) {
          console.error('Could not pass the URL to HORIZON:', error);
        }
        if (attempts < 80) setTimeout(openTarget, 250);
      }
      frame.addEventListener('load', function () { setTimeout(openTarget, 300); });
      setTimeout(openTarget, 300);
    })();
  </script>
</body>

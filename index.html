<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Juegos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* --- BANNER SUPERIOR --- */
    .banner {
      width: 100%;
      height: 420px;
      overflow: hidden;
      position: relative;
      background-color: #000;
    }

    .banner-lista {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .banner-item {
      min-width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 30px 5%;
    }

    .banner-info {
      background: rgba(0, 0, 0, 0.75);
      padding: 20px;
      max-width: 500px;
      border-radius: 4px;
    }

    .banner-info h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .banner-info p {
      font-size: 15px;
      color: #cccccc;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .btn-ver {
      display: inline-block;
      background-color: #e50914;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 3px;
      font-size: 14px;
    }

    /* --- SECCIÓN DE FILAS --- */
    .contenedor {
      padding: 30px 5%;
    }

    .fila {
      margin-bottom: 40px;
    }

    .fila-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 8px;
    }

    .fila-titulo {
      font-size: 20px;
    }

    .ver-todos {
      color: #aaaaaa;
      text-decoration: none;
      font-size: 14px;
    }

    .ver-todos:hover {
      color: #ffffff;
    }

    /* --- CONTENEDOR DE FILA + FLECHAS --- */
    .fila-cuerpo {
      position: relative;
    }

    .fila-tarjetas {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .fila-tarjetas::-webkit-scrollbar {
      display: none;
    }

    .btn-flecha {
      position: absolute;
      top: 90px;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      border: 1px solid #444;
      width: 36px;
      height: 50px;
      cursor: pointer;
      font-size: 18px;
      z-index: 2;
    }

    .btn-flecha:hover {
      background-color: #000;
      border-color: #fff;
    }

    .flecha-izq {
      left: 0;
      display: none;
    }

    .flecha-der {
      right: 0;
    }

    /* --- TARJETAS 4:3 --- */
    .tarjeta {
      width: 240px;
      flex-shrink: 0;
    }

    .tarjeta a {
      text-decoration: none;
      color: inherit;
    }

    .tarjeta img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background-color: #222;
      border-radius: 3px;
    }

    .tarjeta p {
      margin-top: 8px;
      font-size: 15px;
      color: #dddddd;
    }
  </style>
</head>
<body>

  <!-- PANEL SUPERIOR -->
  <div class="banner">
    <div class="banner-lista" id="bannerLista">
      
      <div class="banner-item" style="background-image: url('https://picsum.photos');">
        <div class="banner-info">
          <h1>Aventura Espacial</h1>
          <p>Pilota tu nave a través de campos de asteroides y descubre nuevos planetas.</p>
          <a href="juegos/espacial.html" class="btn-ver">Jugar ahora</a>
        </div>
      </div>

      <div class="banner-item" style="background-image: url('https://picsum.photos');">
        <div class="banner-info">
          <h1>Carrera Nocturna</h1>
          <p>Compite contra el reloj en circuitos urbanos llenos de obstáculos.</p>
          <a href="juegos/carrera.html" class="btn-ver">Jugar ahora</a>
        </div>
      </div>

    </div>
  </div>

  <!-- AQUÍ SE GENERAN LAS FILAS AUTOMÁTICAMENTE DESDE juegos.js -->
  <div class="contenedor" id="catalogo"></div>

  <!-- IMPORTAMOS EL ARCHIVO CON LOS DATOS DE LOS JUEGOS -->
  <script src="juegos.js"></script>

  <script>
    // 1. MOVER EL BANNER SUPERIOR
    const banner = document.getElementById('bannerLista');
    const total = banner.children.length;
    let actual = 0;

    setInterval(function() {
      actual++;
      if (actual >= total) actual = 0;
      banner.style.transform = 'translateX(-' + (actual * 100) + '%)';
    }, 4000);

    // 2. LEER juegos.js Y CREAR LAS FILAS Y TARJETAS
    const catalogo = document.getElementById('catalogo');

    // Obtener los nombres únicos de cada fila ("Populares", "Arcade", etc.)
    const nombresFilas = [...new Set(listaJuegos.map(juego => juego.fila))];

    nombresFilas.forEach(nombreFila => {
      // Filtrar los juegos que pertenecen a esta fila
      const juegosDeEstaFila = listaJuegos.filter(juego => juego.fila === nombreFila);

      // Crear el HTML de todas las tarjetas de esta fila
      let tarjetasHTML = '';
      juegosDeEstaFila.forEach(juego => {
        tarjetasHTML += `
          <div class="tarjeta">
            <a href="${juego.juegoUrl}">
              <img src="${juego.imagen}" alt="${juego.titulo}">
              <p>${juego.titulo}</p>
            </a>
          </div>
        `;
      });

      // Insertar la fila completa en la página
      catalogo.innerHTML += `
        <div class="fila">
          <div class="fila-cabecera">
            <h2 class="fila-titulo">${nombreFila}</h2>
            <a href="#" class="ver-todos">Ver todos</a>
          </div>

          <div class="fila-cuerpo">
            <button class="btn-flecha flecha-izq" onclick="moverAtras(this)">&larr;</button>
            <button class="btn-flecha flecha-der" onclick="moverAdelante(this)">&rarr;</button>

            <div class="fila-tarjetas">
              ${tarjetasHTML}
            </div>
          </div>
        </div>
      `;
    });

    // 3. FUNCIONES DE LAS FLECHAS
    function moverAdelante(boton) {
      const cuerpo = boton.parentElement;
      const lista = cuerpo.querySelector('.fila-tarjetas');
      const flechaIzquierda = cuerpo.querySelector('.flecha-izq');

      lista.scrollLeft += 500;
      flechaIzquierda.style.display = 'block';
    }

    function moverAtras(boton) {
      const cuerpo = boton.parentElement;
      const lista = cuerpo.querySelector('.fila-tarjetas');

      lista.scrollLeft -= 500;
    }
  </script>

</body>
</html>

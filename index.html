  <script>
    const banner = document.getElementById('bannerList');
    fetch('goikoa.html')
      .then(function(response) {
        if (!response.ok) throw new Error('Could not load goikoa.html');
        return response.text();
      })
      .then(function(source) {
        const parsed = new DOMParser().parseFromString(source, 'text/html');
        banner.innerHTML = Array.from(parsed.body.querySelectorAll('.banner-item'))
          .map(function(item) { return item.outerHTML; }).join('');
        const gamesCount = gamesList.length;
        banner.querySelectorAll('[data-games-count]').forEach(function(node) { node.textContent = gamesCount + ' games'; });
        if (banner.children.length > 1) {
          const indicators = document.getElementById('bannerIndicators');
          let current = 0;
          const dots = Array.from(banner.children).map(function(_, index) {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'banner-dot' + (index === 0 ? ' active' : '');
            dot.setAttribute('aria-label', 'Ir al banner ' + (index + 1));
            dot.setAttribute('aria-pressed', index === 0 ? 'true' : 'false');
            dot.addEventListener('click', function() { showBanner(index); });
            indicators.appendChild(dot);
            return dot;
          });
          function showBanner(index) {
            current = (index + banner.children.length) % banner.children.length;
            banner.style.transform = 'translateX(-' + (current * 100) + '%)';
            dots.forEach(function(dot, dotIndex) {
              const selected = dotIndex === current;
              dot.classList.toggle('active', selected);
              dot.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
          }
          setInterval(function() {
            showBanner(current + 1);
          }, 4000);
        }
      })
      .catch(function(error) {
        console.error('Banner loading error:', error);
      });
    const catalog = document.getElementById('catalog');
    const genreFilter = document.getElementById('genreFilter');
    let popularity = {};
    function gameViews(game, index) { const stableId = game.id ?? index; return Number((popularity[String(stableId)] || {}).views || 0); }
    function makeCard(item) {
      const game = item.game;
      return '<div class="card"><a href="jokue.html?id=' + item.game.id + '">' +
        '<img src="' + game.image + '" alt="' + game.title + '" loading="lazy" decoding="async">' +
        '<p>' + game.title + '</p><span>' + game.row + ' · ' + gameViews(game, item.index) + ' views</span></a></div>';
    }
    function makeRow(title, items) {
      if (!items.length) return '';
      const filterValue = title === 'Most Popular' ? 'all-games' : (title === 'Recently Added' ? 'recently-added' : title);
      const viewAll = '<a class="view-all" href="#" data-genre-filter="' + encodeURIComponent(filterValue) + '">View all</a>';
      return '<section class="row"><div class="row-header"><h2 class="row-title">' + title +
        '</h2>' + viewAll + '</div>' +
        '<div class="row-body"><button class="arrow-btn arrow-left" aria-label="Scroll left" onclick="scrollBack(this)">&#x2039;</button>' +
        '<button class="arrow-btn arrow-right" aria-label="Scroll right" onclick="scrollForward(this)">&#x203A;</button>' +
        '<div class="row-cards">' + items.map(makeCard).join('') + '</div></div></section>';
    }
    function renderCatalog() {
      const allItems = gamesList.map(function(game,index) { return {game:game,index:index}; });
      const regularItems = allItems.filter(function(item) { return item.game.row !== 'Other Apps & Services'; });
      const appItems = allItems.filter(function(item) { return item.game.row === 'Other Apps & Services'; });
      const genres = Array.from(new Set(regularItems.map(function(item) { return item.game.row || 'Other'; }))).sort(function(a,b) { return a.localeCompare(b); });
      const popular = regularItems.slice().sort(function(a,b) { return gameViews(b.game,b.index) - gameViews(a.game,a.index); });
      const recent = regularItems.filter(function(item) { return item.game.addedAt && (Date.now() - new Date(item.game.addedAt + 'T00:00:00').getTime()) < 10 * 24 * 60 * 60 * 1000; }).sort(function(a,b) { return new Date(b.game.addedAt) - new Date(a.game.addedAt) || b.index - a.index; });
      catalog.innerHTML = (appItems.length ? makeRow('Other Apps & Services', appItems) + '<div class="catalog-separator catalog-separator-strong"></div>' : '') + [
        makeRow('Most Popular', popular),
        makeRow('Recently Added', recent)
      ].concat(genres.map(function(genre) {
        return makeRow(genre, regularItems.filter(function(item) { return (item.game.row || 'Other') === genre; }));
      })).join('');
      const selected = Array.from(genreFilter.selectedOptions).map(function(option){return option.value;});
      genreFilter.innerHTML = '<option value="all-games">All games</option>';
      const appsOption = document.createElement('option'); appsOption.value = 'Other Apps & Services'; appsOption.textContent = 'Other Apps & Services'; genreFilter.appendChild(appsOption);
      const recentOption = document.createElement('option'); recentOption.value = 'recently-added'; recentOption.textContent = 'Recently Added'; genreFilter.appendChild(recentOption);
      genres.forEach(function(genre) { const option = document.createElement('option'); option.value = genre; option.textContent = genre; genreFilter.appendChild(option); });
      selected.forEach(function(value){const option=Array.from(genreFilter.options).find(function(item){return item.value===value;});if(option)option.selected=true;});
      renderFilterOptions();
    }
    function loadPopularity() {
      // Render the full catalog immediately; remote statistics must never block first paint.
      renderCatalog();
      applyInitialFilter();
      if (typeof APPS_SCRIPT_URL === 'undefined' || !APPS_SCRIPT_URL) return;
      let settled = false;
      const script = document.createElement('script');
      const finish = function(data) {
        if (settled) return;
        settled = true;
        popularity = (data && data.stats) || {};
        renderCatalog();
        applyInitialFilter();
        script.remove();
        delete window.receivePopularity;
      };
      window.receivePopularity = finish;
      script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') >= 0 ? '&' : '?') + 'callback=receivePopularity&_=' + Date.now();
      script.onerror = function() { finish(null); };
      // Ignore a stalled stats endpoint; the already-rendered catalog remains usable.
      setTimeout(function() { if (!settled) finish(null); }, 4500);
      document.body.appendChild(script);
    }
    function filterGames() {
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedGenres = Array.from(document.getElementById('genreFilter').selectedOptions).map(function(option){return option.value;});
      const allSelected = selectedGenres.indexOf('all-games') >= 0;
      const recentOnly = selectedGenres.indexOf('recently-added') >= 0;
      const selectedGenreNames = selectedGenres.filter(function(value){return value !== 'all-games' && value !== 'recently-added';});
      const topBanner = document.getElementById('topBanner');
      const searchResults = document.getElementById('searchResults');
      const resultsGrid = document.getElementById('resultsGrid');
      const resultsTitle = document.getElementById('resultsTitle');
      const clearBtn = document.getElementById('clearBtn');
      if (searchText === '' && selectedGenres.length === 0) { topBanner.style.display = 'block'; document.getElementById('catalog').style.display = 'block'; searchResults.style.display = 'none'; clearBtn.style.display = 'none'; return; }
      topBanner.style.display = 'none'; document.getElementById('catalog').style.display = 'none'; searchResults.style.display = 'block'; clearBtn.style.display = 'inline-block';
      const recentCutoff = Date.now() - 10 * 24 * 60 * 60 * 1000;
      const matches = gamesList.map(function(game,index) { return {game:game,index:index}; }).filter(function(item) {
        const addedTime = item.game.addedAt ? new Date(item.game.addedAt + 'T00:00:00').getTime() : 0;
        return item.game.title.toLowerCase().includes(searchText) && (allSelected || selectedGenreNames.length === 0 || selectedGenreNames.indexOf(item.game.row || 'Other') >= 0) && (!recentOnly || (addedTime > 0 && addedTime >= recentCutoff));
      }).sort(function(a,b) { return recentOnly ? (new Date(b.game.addedAt) - new Date(a.game.addedAt) || b.index - a.index) : (gameViews(b.game,b.index) - gameViews(a.game,a.index)); });
      resultsTitle.textContent = recentOnly ? 'Recently Added' : (allSelected ? 'All games (' + matches.length + ')' : (selectedGenres.length ? selectedGenres.join(' + ') + ' (' + matches.length + ')' : 'Search results (' + matches.length + ')'));
      resultsGrid.innerHTML = matches.length ? matches.map(makeCard).join('') : '<p class="no-results">No games found matching your search.</p>';
    }
    function selectGenre(genreName) {
      const filter = document.getElementById('genreFilter');
      const recentTrigger = document.getElementById('recentFilterTrigger');
      if (genreName === 'recently-added') {
        Array.from(filter.options).forEach(function(option){option.selected=option.value==='recently-added';});
        renderFilterOptions();
        document.getElementById('searchInput').value = '';
        filterGames();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const targetValue = genreName === 'Most Popular' ? 'all-games' : genreName;
      Array.from(filter.options).forEach(function(option){option.selected=option.value===targetValue;});
      renderFilterOptions();
      document.getElementById('searchInput').value = '';
      filterGames();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    catalog.addEventListener('click', function(event) {
      const link = event.target.closest('a.view-all[data-genre-filter]');
      if (!link) return;
      event.preventDefault();
      selectGenre(decodeURIComponent(link.getAttribute('data-genre-filter')));
    });
    function renderFilterOptions() {
      const holder=document.getElementById('filterOptions');
      if(!holder)return;
      const selected=new Set(Array.from(genreFilter.selectedOptions).map(function(option){return option.value;}));
      holder.innerHTML='';
      Array.from(genreFilter.options).forEach(function(option){
        const label=document.createElement('label');label.className='filter-option';
        const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=option.value;checkbox.checked=selected.has(option.value);
        checkbox.addEventListener('change',function(){
          if(option.value==='all-games'&&checkbox.checked){Array.from(genreFilter.options).forEach(function(item){item.selected=item.value==='all-games';});}
          else {
            const allOption=Array.from(genreFilter.options).find(function(item){return item.value==='all-games';});
            if(allOption)allOption.selected=false;
            option.selected=checkbox.checked;
          }
          renderFilterOptions();filterGames();
        });
        label.appendChild(checkbox);label.appendChild(document.createTextNode(option.textContent));holder.appendChild(label);
      });
      updateFilterButton();
    }
    function updateFilterButton(){
      const count=genreFilter.selectedOptions.length,badge=document.getElementById('filterCount'),trigger=document.getElementById('filterTrigger');
      badge.textContent=count;badge.classList.toggle('visible',count>0);
      trigger.setAttribute('aria-label',count?'Filter, '+count+' selected':'Filter');
    }
    const filterTrigger=document.getElementById('filterTrigger'),filterMenu=document.getElementById('filterMenu');
    filterTrigger.addEventListener('click',function(){const open=filterMenu.hidden;filterMenu.hidden=!open;filterTrigger.setAttribute('aria-expanded',String(open));});
    document.getElementById('clearGenreSelection').addEventListener('click',function(){Array.from(genreFilter.options).forEach(function(option){option.selected=false;});renderFilterOptions();filterGames();});
    document.addEventListener('click',function(event){if(!event.target.closest('.filter-wrap')){filterMenu.hidden=true;filterTrigger.setAttribute('aria-expanded','false');}});
    document.addEventListener('keydown',function(event){if(event.key==='Escape'){filterMenu.hidden=true;filterTrigger.setAttribute('aria-expanded','false');}});
    function resetFilters() { document.getElementById('searchInput').value = ''; Array.from(genreFilter.options).forEach(function(option){option.selected=false;}); renderFilterOptions(); filterGames(); }
    function applyInitialFilter() { if (new URLSearchParams(window.location.search).get('genre') === 'all-games') { Array.from(genreFilter.options).forEach(function(option){option.selected=option.value==='all-games';}); renderFilterOptions(); filterGames(); } }
    function scrollForward(button) { const body = button.parentElement; body.querySelector('.row-cards').scrollLeft += 500; body.querySelector('.arrow-left').style.display = 'block'; }
    function scrollBack(button) { button.parentElement.querySelector('.row-cards').scrollLeft -= 500; }
    loadPopularity();
  </script>
  <script src="itzuli.js"></script>
  <script src="ezarpenak.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNBLOCKEDgames</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #eeeeee; font-family: Arial, Helvetica, sans-serif; }
    .top-bar { background-color: #1a1a1a; padding: 10px 4%; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .brand-logo { display: block; width: 250px; height: 48px; object-fit: contain; object-position: left center; }
    .main-nav { display: flex; align-items: center; gap: 6px; }
    .nav-tab { background: transparent; color: #aaaaaa; border: 1px solid transparent; padding: 9px 13px; border-radius: 4px; font-size: 14px; cursor: pointer; }
    .nav-tab:hover { color: #ffffff; background: #262626; }
    .nav-tab.active { color: #ffffff; background: #303030; border-color: #484848; }
    @media (max-width: 900px) {
      .top-bar { justify-content: center; }
      .brand-logo { width: 230px; height: 44px; }
      .top-bar > a { margin: 0 auto; }
      .main-nav { order: 3; width: 100%; justify-content: center; }
      .search-controls { order: 4; width: 100%; justify-content: center; }
      .search-input { width: min(240px, 55vw); }
    }
    .search-controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-input, .genre-select { background-color: #262626; color: #eeeeee; border: 1px solid #3a3a3a; padding: 8px 12px; font-size: 14px; border-radius: 3px; outline: none; }
    .search-input { width: 240px; }
    .search-input:focus, .genre-select:focus { border-color: #666666; }
    .btn-clear { background-color: #333333; color: #cccccc; border: 1px solid #444444; padding: 8px 12px; font-size: 14px; border-radius: 3px; cursor: pointer; display: none; }
    .btn-clear:hover { background-color: #444444; color: #ffffff; }
    .banner { width: 100%; height: 420px; overflow: hidden; position: relative; background-color: #000; }
    .banner-list { display: flex; height: 100%; transition: transform 0.5s ease; }
    .banner-item { min-width: 100%; height: 100%; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 30px 5%; }
    .banner-info { background: rgba(0, 0, 0, 0.75); padding: 20px; max-width: 500px; border-radius: 4px; }
    .banner-info h1 { font-size: 28px; margin-bottom: 10px; }
    .banner-info p { font-size: 15px; color: #cccccc; margin-bottom: 15px; line-height: 1.4; }
    .btn-play { display: inline-block; background-color: #e50914; color: #fff; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 3px; font-size: 14px; }
    .container { padding: 30px 5%; }
    .grandv-shortcut { display: flex; align-items: center; gap: 22px; padding: 18px; background: #1b1b1b; border: 1px solid #333; border-radius: 5px; }
    .grandv-art { width: 150px; min-width: 150px; aspect-ratio: 4 / 3; display: grid; place-items: center; background: linear-gradient(135deg, #202820, #111); color: #e7e7e7; font-size: 76px; font-weight: 900; font-style: italic; border-radius: 3px; text-shadow: 3px 3px #555; }
    .grandv-info h2 { font-size: 20px; margin-bottom: 8px; }
    .grandv-info p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
    @media (max-width: 520px) { .grandv-shortcut { align-items: flex-start; flex-direction: column; } .grandv-art { width: 100%; } }

    .row { margin-bottom: 40px; }
    .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .row-title { font-size: 20px; }
    .view-all { color: #aaaaaa; text-decoration: none; font-size: 14px; cursor: pointer; }
    .view-all:hover { color: #ffffff; }
    .row-body { position: relative; }
    .row-cards { display: flex; gap: 15px; padding: 12px 8px 16px; margin: -12px -8px -4px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
    .row-cards::-webkit-scrollbar { display: none; }
    .arrow-btn { position: absolute; top: 90px; transform: translateY(-50%); background-color: rgba(0, 0, 0, 0.8); color: #ffffff; border: 1px solid #444; width: 36px; height: 50px; cursor: pointer; font-size: 18px; z-index: 2; }
    .arrow-btn:hover { background-color: #000; border-color: #fff; }
    .arrow-left { left: 0; display: none; }
    .arrow-right { right: 0; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .results-grid .card { width: 100%; }
    .no-results { color: #999999; font-size: 16px; padding: 20px 0; }
    .card { width: 240px; flex-shrink: 0; position: relative; border: 1px solid transparent; border-radius: 9px; padding: 7px; background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.008)); transform: translateY(0) scale(1); transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease; }
    .card a { display: block; text-decoration: none; color: inherit; }
    .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background-color: #222; border-radius: 5px; transition: filter .22s ease; }
    .card p { margin-top: 8px; font-size: 15px; color: #dddddd; transition: color .22s ease; }
    .card span { display: block; font-size: 12px; color: #888888; margin-top: 3px; }
    .card:hover, .card:focus-within { z-index: 3; transform: translateY(-5px) scale(1.035); border-color: rgba(var(--game-color, 110, 180, 230), .9); background: linear-gradient(145deg, rgba(var(--game-color, 110, 180, 230), .34), rgba(22,22,22,.97) 78%); box-shadow: 0 8px 24px rgba(var(--game-color, 110, 180, 230), .25), 0 0 0 1px rgba(var(--game-color, 110, 180, 230), .2); }
    .card:hover img, .card:focus-within img { filter: saturate(1.12) brightness(1.04); }
    .card:hover p, .card:focus-within p { color: #fff; }
    @media (prefers-reduced-motion: reduce) { .card, .card img, .card p { transition: none; } .card:hover, .card:focus-within { transform: none; } }
    .site-footer { background: #1a1a1a; border-top: 1px solid #2a2a2a; padding: 24px 5%; margin-top: 35px; color: #aaaaaa; text-align: center; font-size: 13px; line-height: 1.8; }
    .site-footer a { color: #dddddd; text-decoration: underline; }
    .site-footer a:hover { color: #ffffff; }
    .site-footer p + p { margin-top: 5px; }
    .license-icons img { max-width: 1em; max-height: 1em; margin-left: .2em; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" aria-label="UNBLOCKEDgames"><img class="brand-logo" src="argazkik/UNBLOCKEDgames_logo.svg?v=3" alt="UNBLOCKEDgames"></a>
    <nav class="main-nav" aria-label="Main menu">
      <a class="nav-tab active" href="index.html">Games</a>
      <a class="nav-tab" href="proxy.html"> GUST Proxy</a>
      <a class="nav-tab" href="https://sites.google.com/view/search-internet/google" target="_blank" rel="noopener noreferrer">Launcher</a>
    </nav>
    <div class="search-controls" id="gameSearchControls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search games..." oninput="filterGames()">
      <select id="genreFilter" class="genre-select" onchange="filterGames()"><option value="all">All genres</option></select>
      <button id="clearBtn" class="btn-clear" onclick="resetFilters()">Clear</button>
    </div>
  </div>
  <main id="gamesPage">
  <div class="banner" id="topBanner">
    <div class="banner-list" id="bannerList"></div>
  </div>
  <div class="container" id="catalog"></div>
  <div class="container" id="searchResults" style="display: none;">
    <div class="row-header"><h2 class="row-title" id="resultsTitle">Search results</h2></div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>
  </main>

  </footer>
  <script src="jokunlistea.js"></script>
  <script src="config.js"></script>
  <script>
    const banner = document.getElementById('bannerList');
    fetch('goikoa.html')
      .then(function(response) {
        if (!response.ok) throw new Error('Could not load goikoa.html');
        return response.text();
      })
      .then(function(source) {
        const parsed = new DOMParser().parseFromString(source, 'text/html');
        banner.innerHTML = Array.from(parsed.body.querySelectorAll('.banner-item'))
          .map(function(item) { return item.outerHTML; }).join('');
        if (banner.children.length > 1) {
          let current = 0;
          setInterval(function() {
            current = (current + 1) % banner.children.length;
            banner.style.transform = 'translateX(-' + (current * 100) + '%)';
          }, 4000);
        }
      })
      .catch(function(error) {
        console.error('Banner loading error:', error);
      });
    const catalog = document.getElementById('catalog');
    const genreFilter = document.getElementById('genreFilter');
    let popularity = {};
    function gameViews(game, index) { return Number((popularity[String(index)] || {}).views || 0); }
    function makeCard(item) {
      const game = item.game;
      return '<div class="card"><a href="jokue.html?id=' + item.index + '">' +
        '<img src="' + game.image + '" alt="' + game.title + '">' +
        '<p>' + game.title + '</p><span>' + game.row + ' · ' + gameViews(game, item.index) + ' views</span></a></div>';
    }
    function applyThumbnailColors(container) {
      container.querySelectorAll('.card img').forEach(function(original) {
        if (original.dataset.colorChecked) return;
        original.dataset.colorChecked = '1';
        const sampler = new Image();
        sampler.crossOrigin = 'anonymous';
        sampler.onload = function() {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(sampler, 0, 0, 32, 32);
            const pixels = ctx.getImageData(0, 0, 32, 32).data;
            const buckets = {};
            for (let i = 0; i < pixels.length; i += 4) {
              const alpha = pixels[i + 3];
              const red = pixels[i], green = pixels[i + 1], blue = pixels[i + 2];
              if (alpha < 150) continue;
              const max = Math.max(red, green, blue), min = Math.min(red, green, blue);
              const saturation = max === 0 ? 0 : (max - min) / max;
              if (max < 35 || (max > 242 && saturation < .12)) continue;
              const key = [red, green, blue].map(function(v) { return Math.round(v / 32) * 32; }).join(',');
              const score = 1 + saturation * 1.8;
              if (!buckets[key]) buckets[key] = { score: 0, rgb: [red, green, blue] };
              buckets[key].score += score;
            }
            const winner = Object.keys(buckets).sort(function(a, b) { return buckets[b].score - buckets[a].score; })[0];
            if (winner) {
              const rgb = buckets[winner].rgb.map(function(v) { return Math.round(v); }).join(', ');
              original.closest('.card').style.setProperty('--game-color', rgb);
            }
          } catch (error) {
            console.debug('No se pudo extraer el color de la miniatura:', original.src);
          }
        };
        sampler.src = original.currentSrc || original.src;
      });
    }
    function makeRow(title, items) {
      if (!items.length) return '';
      return '<section class="row"><div class="row-header"><h2 class="row-title">' + title +
        '</h2><a class="view-all" onclick="selectGenre(\'' + title + '\')">View all</a></div>' +
        '<div class="row-body"><button class="arrow-btn arrow-left" onclick="scrollBack(this)">&larr;</button>' +
        '<button class="arrow-btn arrow-right" onclick="scrollForward(this)">&rarr;</button>' +
        '<div class="row-cards">' + items.map(makeCard).join('') + '</div></div></section>';
    }
    function renderCatalog() {
      const genres = Array.from(new Set(gamesList.map(function(g) { return g.row || 'Other'; }))).sort(function(a,b) { return a.localeCompare(b); });
      const allItems = gamesList.map(function(game,index) { return {game:game,index:index}; });
      const popular = allItems.slice().sort(function(a,b) { return gameViews(b.game,b.index) - gameViews(a.game,a.index); });
      catalog.innerHTML = makeRow('Most Popular', popular);
      genres.forEach(function(genre) { catalog.innerHTML += makeRow(genre, allItems.filter(function(item) { return (item.game.row || 'Other') === genre; })); });
      applyThumbnailColors(catalog);
      const selected = genreFilter.value;
      genreFilter.innerHTML = '<option value="all">All genres</option>';
      genres.forEach(function(genre) { const option = document.createElement('option'); option.value = genre; option.textContent = genre; genreFilter.appendChild(option); });
      genreFilter.value = genres.indexOf(selected) >= 0 ? selected : 'all';
    }
    function loadPopularity() {
      if (typeof APPS_SCRIPT_URL === 'undefined' || !APPS_SCRIPT_URL) { renderCatalog(); return; }
      window.receivePopularity = function(data) { popularity = (data && data.stats) || {}; renderCatalog(); };
      const script = document.createElement('script');
      script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') >= 0 ? '&' : '?') + 'callback=receivePopularity&_=' + Date.now();
      script.onerror = renderCatalog;
      document.body.appendChild(script);
    }
    function filterGames() {
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedGenre = genreFilter.value;
      const topBanner = document.getElementById('topBanner');
      const searchResults = document.getElementById('searchResults');
      const resultsGrid = document.getElementById('resultsGrid');
      const resultsTitle = document.getElementById('resultsTitle');
      const clearBtn = document.getElementById('clearBtn');
      if (searchText === '' && selectedGenre === 'all') { topBanner.style.display = 'block'; catalog.style.display = 'block'; searchResults.style.display = 'none'; clearBtn.style.display = 'none'; return; }
      topBanner.style.display = 'none'; catalog.style.display = 'none'; searchResults.style.display = 'block'; clearBtn.style.display = 'inline-block';
      const matches = gamesList.map(function(game,index) { return {game:game,index:index}; }).filter(function(item) {
        return item.game.title.toLowerCase().includes(searchText) && (selectedGenre === 'all' || item.game.row === selectedGenre);
      }).sort(function(a,b) { return gameViews(b.game,b.index) - gameViews(a.game,a.index); });
      resultsTitle.textContent = selectedGenre !== 'all' ? selectedGenre + ' games (' + matches.length + ')' : 'Search results (' + matches.length + ')';
      resultsGrid.innerHTML = matches.length ? matches.map(makeCard).join('') : '<p class="no-results">No games found matching your search.</p>';
      applyThumbnailColors(resultsGrid);
    }
    function selectGenre(genreName) { genreFilter.value = genreName === 'Most Popular' ? 'all' : genreName; filterGames(); window.scrollTo(0,0); }
    function resetFilters() { document.getElementById('searchInput').value = ''; genreFilter.value = 'all'; filterGames(); }
    function scrollForward(button) { const body = button.parentElement; body.querySelector('.row-cards').scrollLeft += 500; body.querySelector('.arrow-left').style.display = 'block'; }
    function scrollBack(button) { button.parentElement.querySelector('.row-cards').scrollLeft -= 500; }
    loadPopularity();
  </script>
</body>
</html>

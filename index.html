<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #eeeeee; font-family: Arial, Helvetica, sans-serif; }

    /* --- TOP BANNER --- */
    .banner { width: 100%; height: 420px; overflow: hidden; position: relative; background-color: #000; }
    .banner-list { display: flex; height: 100%; transition: transform 0.5s ease; }
    .banner-item {
      min-width: 100%; height: 100%; background-size: cover; background-position: center;
      display: flex; align-items: flex-end; padding: 30px 5%;
    }
    .banner-info { background: rgba(0, 0, 0, 0.75); padding: 20px; max-width: 500px; border-radius: 4px; }
    .banner-info h1 { font-size: 28px; margin-bottom: 10px; }
    .banner-info p { font-size: 15px; color: #cccccc; margin-bottom: 15px; line-height: 1.4; }
    .btn-play {
      display: inline-block; background-color: #e50914; color: #fff; text-decoration: none;
      padding: 10px 20px; font-weight: bold; border-radius: 3px; font-size: 14px;
    }

    /* --- ROWS SECTION --- */
    .container { padding: 30px 5%; }
    .row { margin-bottom: 40px; }
    .row-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px;
    }
    .row-title { font-size: 20px; }
    .view-all { color: #aaaaaa; text-decoration: none; font-size: 14px; }
    .view-all:hover { color: #ffffff; }

    .row-body { position: relative; }
    .row-cards { display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
    .row-cards::-webkit-scrollbar { display: none; }

    .arrow-btn {
      position: absolute; top: 90px; transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.8); color: #ffffff; border: 1px solid #444;
      width: 36px; height: 50px; cursor: pointer; font-size: 18px; z-index: 2;
    }
    .arrow-btn:hover { background-color: #000; border-color: #fff; }
    .arrow-left { left: 0; display: none; }
    .arrow-right { right: 0; }

    /* --- 4:3 CARDS --- */
    .card { width: 240px; flex-shrink: 0; }
    .card a { text-decoration: none; color: inherit; }
    .card img {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
      background-color: #222; border-radius: 3px;
    }
    .card p { margin-top: 8px; font-size: 15px; color: #dddddd; }
  </style>
</head>
<body>

  <!-- TOP BANNER -->
  <div class="banner">
    <div class="banner-list" id="bannerList">
      <div class="banner-item" style="background-image: url('images/space.jpg');">
        <div class="banner-info">
          <h1>Space Adventure</h1>
          <p>Pilot your ship through asteroid fields and discover new planets.</p>
          <a href="jokue.html?id=0" class="btn-play">Play now</a>
        </div>
      </div>

      <div class="banner-item" style="background-image: url('images/racing.jpg');">
        <div class="banner-info">
          <h1>Night Rush</h1>
          <p>Race against the clock on urban circuits full of obstacles.</p>
          <a href="jokue.html?id=1" class="btn-play">Play now</a>
        </div>
      </div>
    </div>
  </div>

  <!-- CATALOG -->
  <div class="container" id="catalog"></div>

  <script src="jokunlistea.js"></script>

  <script>
    // Auto-slide the top banner every 4 seconds
    const banner = document.getElementById('bannerList');
    const total = banner.children.length;
    let current = 0;

    setInterval(function() {
      current++;
      if (current >= total) current = 0;
      banner.style.transform = 'translateX(-' + (current * 100) + '%)';
    }, 4000);

    // Build rows and cards from games.js
    const catalog = document.getElementById('catalog');
    const rowNames = [...new Set(gamesList.map(g => g.row))];

    rowNames.forEach(rowName => {
      let cardsHTML = '';

      gamesList.forEach((game, index) => {
        if (game.row === rowName) {
          cardsHTML += `
            <div class="card">
              <a href="jokue.html?id=${index}">
                <img src="${game.image}" alt="${game.title}">
                <p>${game.title}</p>
              </a>
            </div>
          `;
        }
      });

      catalog.innerHTML += `
        <div class="row">
          <div class="row-header">
            <h2 class="row-title">${rowName}</h2>
            <a href="#" class="view-all">View all</a>
          </div>

          <div class="row-body">
            <button class="arrow-btn arrow-left" onclick="scrollBack(this)">&larr;</button>
            <button class="arrow-btn arrow-right" onclick="scrollForward(this)">&rarr;</button>

            <div class="row-cards">
              ${cardsHTML}
            </div>
          </div>
        </div>
      `;
    });

    function scrollForward(button) {
      const body = button.parentElement;
      body.querySelector('.row-cards').scrollLeft += 500;
      body.querySelector('.arrow-left').style.display = 'block';
    }

    function scrollBack(button) {
      button.parentElement.querySelector('.row-cards').scrollLeft -= 500;
    }
  </script>

</body>
</html>

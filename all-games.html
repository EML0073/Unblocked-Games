<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#121212;color:#eee;font-family:Arial,Helvetica,sans-serif}
.top-bar{background:#1a1a1a;padding:10px 4%;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand-logo{display:block;width:280px;height:56px;object-fit:contain;object-position:left center;filter:brightness(0) invert(1)}
.main-nav{display:flex;align-items:center;gap:6px}.nav-tab{color:#aaa;text-decoration:none;padding:9px 13px;border-radius:4px;font-size:14px}.nav-tab:hover{color:#fff;background:#262626}

.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{position:relative;border:1px solid transparent;border-radius:9px;padding:7px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.008));transition:transform .22s,border-color .22s,box-shadow .22s}

.card p{margin-top:8px;font-size:15px;color:#ddd}.card span{display:block;font-size:12px;color:#888;margin-top:3px}
.card:hover{z-index:2;transform:translateY(-5px) scale(1.025);border-color:rgba(var(--game-color,110,180,230),.9);box-shadow:0 8px 24px rgba(var(--game-color,110,180,230),.25)}
.site-footer{background:#1a1a1a;border-top:1px solid #2a2a2a;padding:24px 5%;margin-top:35px;color:#aaa;text-align:center;font-size:13px;line-height:1.8}
.site-footer a{color:#ddd}@media(max-width:900px){.top-bar{justify-content:center}.brand-logo{width:255px;height:50px}}

</head>

<script src="jokunlistea.js"></script><script src="config.js"></script>
<script>
let popularity={};
function views(index){return Number((popularity[String(index)]||{}).views||0)}
function render(){
 const items=gamesList.map((game,index)=>({game,index})).sort((a,b)=>views(b.index)-views(a.index));
 document.getElementById('gameCount').textContent=gamesList.length+' games';
 document.getElementById('allGames').innerHTML=items.map(({game,index})=>'<div class="card"><a href="jokue.html?id='+index+'"><img src="'+game.image+'" alt="'+game.title+'"><p>'+game.title+'</p><span>'+game.row+' · '+views(index)+' views</span></a></div>').join('');
}
if(typeof APPS_SCRIPT_URL==='undefined'||!APPS_SCRIPT_URL){render();}
else{
 window.receiveAllPopularity=function(data){popularity=(data&&data.stats)||{};render()};
 const script=document.createElement('script');script.src=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.includes('?')?'&':'?')+'callback=receiveAllPopularity&_='+Date.now();script.onerror=render;document.body.appendChild(script);
}
</script>

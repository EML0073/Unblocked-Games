<body>
  <!--
    Para añadir un banner, copia un bloque .banner-item.
    href: dirección que se abrirá al pulsar el botón.
    target="_blank": abre en una pestaña nueva.
    target="_self": abre en la misma pestaña.
    También puedes cambiar el título, la descripción, el texto del botón y la imagen.
  -->

  <div class="banner-item" style="background-image: url('argazkik/argazkik/Screenshot 2026-11-22 19.54.27.png');">
    <div class="banner-info">
      <h1>Launcher</h1>
      <p>Abre el Launcher de ASKEgame para acceder a herramientas y recursos de navegación desde la web.</p>
      <a href="https://sites.google.com/view/search-internet/google" target="_blank" rel="noopener noreferrer" class="btn-play">Abrir Launcher</a>
    </div>
  </div>

</body>
</html>

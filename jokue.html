<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading game...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .nav-bar {
      background-color: #1a1a1a;
      padding: 15px 5%;
      border-bottom: 1px solid #2a2a2a;
    }

    .btn-back {
      color: #cccccc;
      text-decoration: none;
      font-size: 15px;
    }

    .btn-back:hover {
      color: #ffffff;
    }

    .game-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .game-info h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .game-genre {
      display: inline-block;
      background-color: #262626;
      color: #bbbbbb;
      border: 1px solid #3a3a3a;
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 3px;
    }

    .btn-maximize {
      background-color: #e50914;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-maximize:hover {
      background-color: #c40812;
    }

    .iframe-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border: 1px solid #333333;
      border-radius: 4px;
      overflow: hidden;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="btn-back">&larr; Back to catalog</a>
  </div>

  <div class="game-container">
    <div class="game-header">
      <div class="game-info">
        <h1 id="gameTitle">Loading...</h1>
        <span class="game-genre" id="gameGenre">Genre</span>
      </div>

      <button class="btn-maximize" onclick="maximizeGame()">&#x26F6; Maximize</button>
    </div>

    <div class="iframe-wrapper">
      <iframe id="gameFrame" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>
    </div>
  </div>

  <script src="jokunlistea.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const game = gamesList[id];

    if (game) {
      document.title = game.title;
      document.getElementById('gameTitle').textContent = game.title;
      document.getElementById('gameGenre').textContent = game.row;

      fetch(game.rawUrl)
        .then(response => {
          if (!response.ok) throw new Error('Failed to fetch game file');
          return response.text();
        })
        .then(htmlCode => {
          document.getElementById('gameFrame').srcdoc = htmlCode;
        })
        .catch(error => {
          document.getElementById('gameTitle').textContent = 'Error loading game';
          console.error(error);
        });
    } else {
      document.getElementById('gameTitle').textContent = 'Game not found';
      document.getElementById('gameGenre').style.display = 'none';
    }

    function maximizeGame() {
      const iframe = document.getElementById('gameFrame');
      
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>

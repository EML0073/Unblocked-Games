<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add a game · UNBLOCKEDgames</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#eee;font:15px Arial,sans-serif;padding:30px 16px}
main{max-width:620px;margin:auto;background:#1d1d1d;border:1px solid #383838;border-radius:8px;padding:24px}
h1{font-size:24px;margin:0 0 8px}p{color:#aaa;line-height:1.5}
label{display:block;margin:16px 0 6px;color:#ddd}input,select{width:100%;padding:12px;background:#111;color:#eee;border:1px solid #555;border-radius:4px}
button{margin-top:18px;padding:12px 18px;background:#e50914;color:white;border:0;border-radius:4px;font-weight:bold;cursor:pointer}
textarea{width:100%;min-height:180px;margin-top:12px;padding:12px;background:#111;color:#eee;border:1px solid #555;border-radius:4px;font:13px monospace}
small{color:#999}
</style></head>
<body><main>
<h1>Add a web game</h1><p>Enter the details of a game hosted on a normal website. This tool generates the entry to add to <code>jokunlistea.js</code>; it does not publish changes automatically.</p>
<label for="title">Game title</label><input id="title" placeholder="e.g. Example Game" required>
<label for="genre">Genre</label><select id="genre"><option>Arcade</option><option>Action</option><option>Adventure</option><option>Horror</option><option>Multiplayer</option><option>Platformer</option><option>Puzzle</option><option>Racing</option><option>Runner</option><option>Shooter</option><option>Simulation</option><option>Sports</option><option>Strategy</option><option>Idle</option></select>
<label for="url">Website URL</label><input id="url" type="url" placeholder="https://example.com/game" required>
<label for="image">Thumbnail image URL</label><input id="image" type="url" placeholder="https://example.com/logo.png" required>
<button type="button" onclick="generate()">Generate game entry</button>
<textarea id="output" readonly placeholder="Your game entry will appear here..."></textarea>
<button type="button" onclick="copyEntry()">Copy entry</button>
<p><small>Paste the generated object into the gamesList array in jokunlistea.js. The proxy service must be deployed and configured first.</small></p>
</main>
<script>
function generate(){
 const title=document.getElementById('title').value.trim(),url=document.getElementById('url').value.trim(),image=document.getElementById('image').value.trim();
 try{const u=new URL(url),img=new URL(image);if(!['http:','https:'].includes(u.protocol)||!['http:','https:'].includes(img.protocol))throw 0;}catch(e){alert('Enter valid http:// or https:// URLs for the game and thumbnail.');return;}
 if(!title){alert('Enter a game title.');return;}
 const entry={row:document.getElementById('genre').value,title,addedAt:new Date().toISOString().slice(0,10),image,webUrl:url};
 document.getElementById('output').value='  '+JSON.stringify(entry,null,2).replace(/\n/g,'\n  ')+',';
}
function copyEntry(){const t=document.getElementById('output');if(!t.value){alert('Generate the entry first.');return;}t.select();document.execCommand('copy');alert('Copied.');}
</script></body></html>
